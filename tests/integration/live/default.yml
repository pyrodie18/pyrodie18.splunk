---
hide_password: true
splunk:
  conf:
    - key: server
      value:
        content:
          sslConfig:
            serverCert: /opt/splunk-ci/server.pem
            sslRootCAPath: /opt/splunk-ci/ca.pem
            sslPassword: ''
          dataplaneSslConfig:
            serverCertDataplane: /opt/splunk-ci/server_dp.pem
