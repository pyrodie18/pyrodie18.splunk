---
- name: Exercise the Splunk REST module without an SSH connection
  hosts: splunk_fixture
  gather_facts: false
  tasks:
    - name: Read Splunk identity using a bearer token
      pyrodie18.splunk.server_info:
      register: bearer_result

    - name: Read Splunk identity using Basic auth in check mode
      pyrodie18.splunk.server_info:
        username: fixture
        password: "{{ fixture_password }}"
      delegate_to: localhost
      check_mode: true
      register: basic_result

    - name: Verify results
      ansible.builtin.assert:
        that:
          - bearer_result is not changed
          - basic_result is not changed
          - bearer_result.server_name == 'splunk-fixture'
          - bearer_result.guid == 'fixture-guid'
          - bearer_result.version == '10.2.2'
          - bearer_result.build == 'fixture-build'
          - bearer_result.roles == ['indexer', 'kv_store']
          - basic_result.server_name == bearer_result.server_name
          - basic_result.roles == bearer_result.roles

    - name: Test TLS verification without the fixture CA
      pyrodie18.splunk.server_info:
        token: "{{ fixture_token }}"
        ca_path: null
      register: tls_result
      ignore_errors: true

    - name: Verify the untrusted certificate was rejected
      ansible.builtin.assert:
        that:
          - tls_result is failed
          - "'TLS verification' in tls_result.msg"

    - name: Exercise management API failures
      pyrodie18.splunk.server_info:
        token: "fixture-{{ item.scenario }}-token"
        timeout: 1
      loop_control:
        label: "{{ item.message }}"
      loop:
        - scenario: redirect
          message: redirect rejected
          status: 302
        - scenario: bad
          message: authentication failed
          status: 401
        - scenario: forbidden
          message: permission denied
          status: 403
        - scenario: malformed
          message: invalid JSON
        - scenario: timeout
          message: request timed out
      register: failure_results
      ignore_errors: true

    - name: Verify management API errors
      ansible.builtin.assert:
        that:
          - item is failed
          - item.item.message in item.msg
          - item.status | default(0) == item.item.status | default(0)
      loop: "{{ failure_results.results }}"
      loop_control:
        label: "{{ item.item.message }}"

    - name: Predict index creation
      pyrodie18.splunk.index:
        name: fixture_events
        retention_seconds: 86400
        max_total_size_mb: 500
      check_mode: true
      diff: true
      register: index_preview

    - name: Read the index after the preview
      pyrodie18.splunk.index_info:
        name: fixture_events
      register: missing_index

    - name: Verify creation was predicted without writing
      ansible.builtin.assert:
        that:
          - index_preview is changed
          - index_preview.diff.after.retention_seconds == 86400
          - missing_index.indexes == []

    - name: Try to create an index without write permission
      pyrodie18.splunk.index:
        name: fixture_events
        retention_seconds: 86400
        max_total_size_mb: 500
        token: "{{ 'fixture-forbidden-token' }}"
      register: index_denied
      ignore_errors: true

    - name: Check the write error
      ansible.builtin.assert:
        that:
          - index_denied is failed
          - index_denied is not changed
          - index_denied.status == 403
          - "'permission denied' in index_denied.msg"

    - name: Create the event index
      pyrodie18.splunk.index:
        name: fixture_events
        retention_seconds: 86400
        max_total_size_mb: 500
      register: created_index

    - name: Update only retention
      pyrodie18.splunk.index:
        name: fixture_events
        retention_seconds: 172800
      register: updated_index

    - name: Repeat the update
      pyrodie18.splunk.index:
        name: fixture_events
        retention_seconds: 172800
      register: repeated_index

    - name: List and normalize the stored index
      pyrodie18.splunk.index_info:
      register: list_indexes

    - name: Verify requested settings and convergence
      ansible.builtin.assert:
        that:
          - created_index is changed
          - updated_index is changed
          - repeated_index is not changed
          - list_indexes is not changed
          - list_indexes.indexes == [updated_index.index]
          - updated_index.index.name == 'fixture_events'
          - updated_index.index.datatype == 'event'
          - updated_index.index.retention_seconds == 172800
          - updated_index.index.max_total_size_mb == 500

- name: Exercise both modules with the same inventory host
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Read the API version
      pyrodie18.splunk.server_info:
      register: mixed_api

    - name: Read the CLI service information
      pyrodie18.splunk.service_info:
      check_mode: true
      register: mixed_service

    - name: Verify both connections and unchanged results
      ansible.builtin.assert:
        that:
          - mixed_api is not changed
          - mixed_service is not changed
          - mixed_api.version == '10.2.2'
          - mixed_api.version in mixed_service.version
          - mixed_service.status == 'splunkd is running (PID 42).'
