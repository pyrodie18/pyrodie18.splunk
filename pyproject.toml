[project]
name = "pyrodie18-splunk"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "ansible-core>=2.21,<2.22",
    "ruff>=0.17.6",
]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "C4", "EXE"]

[tool.ruff.lint.per-file-ignores]
# Ansible modules keep documentation before imports and are non-executable.
"plugins/modules/*.py" = ["E402", "EXE001"]
